openapi: 3.1.0
info:
  title: HitHub HTTP API
  version: 0.1.0
  description: Repository metadata and reference management for HitHub.
servers:
  - url: http://localhost
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
                required: [status, runtime]
                properties:
                  status: {type: string}
                  runtime: {type: string}
  /api/repos:
    get:
      operationId: listRepositories
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Visible repositories
          headers:
            Link: {$ref: '#/components/headers/Link'}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Repository'}
              example:
                - id: 01234567-89ab-cdef-0123-456789abcdef
                  name: demo
                  description: Example repository
                  default_branch: refs/heads/main
                  version: 1
    post:
      operationId: createRepository
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RepositoryCreate'}
      responses:
        '201':
          description: Repository created
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Repository'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/repos/{repo}:
    parameters:
      - {$ref: '#/components/parameters/RepositoryName'}
    get:
      operationId: getRepository
      responses:
        '200':
          description: Repository
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Repository'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateRepository
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RepositoryPatch'}
      responses:
        '200':
          description: Updated repository
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Repository'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
    delete:
      operationId: softDeleteRepository
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '204': {description: Repository hidden}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /api/repos/{repo}/purge:
    parameters:
      - {$ref: '#/components/parameters/RepositoryName'}
    post:
      operationId: purgeRepository
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '204': {description: Repository permanently purged}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /api/repos/{repo}/branches:
    parameters:
      - {$ref: '#/components/parameters/RepositoryName'}
    get:
      operationId: listBranches
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Repository branches
          headers:
            Link: {$ref: '#/components/headers/Link'}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Reference'}
              example:
                - name: refs/heads/main
                  algorithm: sha1
                  oid: 1111111111111111111111111111111111111111
                  version: 1
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createBranch
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReferenceCreate'}
      responses:
        '201':
          description: Branch created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reference'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/repos/{repo}/branches/{branch}:
    parameters:
      - {$ref: '#/components/parameters/RepositoryName'}
      - {$ref: '#/components/parameters/ReferenceName'}
    get:
      operationId: getBranch
      responses:
        '200':
          description: Branch
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reference'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateBranch
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReferencePatch'}
      responses:
        '200':
          description: Updated branch
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reference'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
    delete:
      operationId: deleteBranch
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '204': {description: Branch deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /api/repos/{repo}/tags:
    parameters:
      - {$ref: '#/components/parameters/RepositoryName'}
    get:
      operationId: listTags
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Repository tags
          headers:
            Link: {$ref: '#/components/headers/Link'}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Reference'}
              example:
                - name: refs/tags/v1.0.0
                  algorithm: sha1
                  oid: 2222222222222222222222222222222222222222
                  version: 1
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createTag
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReferenceCreate'}
      responses:
        '201':
          description: Tag created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reference'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/repos/{repo}/tags/{tag}:
    parameters:
      - {$ref: '#/components/parameters/RepositoryName'}
      - {$ref: '#/components/parameters/TagName'}
    get:
      operationId: getTag
      responses:
        '200':
          description: Tag
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reference'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateTag
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReferencePatch'}
      responses:
        '200':
          description: Updated tag
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reference'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
    delete:
      operationId: deleteTag
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '204': {description: Tag deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: {type: integer, minimum: 1, default: 1}
    PerPage:
      name: per_page
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 30}
    RepositoryName:
      name: repo
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9._-]+$'}
    ReferenceName:
      name: branch
      in: path
      required: true
      schema: {type: string, minLength: 1}
    TagName:
      name: tag
      in: path
      required: true
      schema: {type: string, minLength: 1}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"?[0-9]+"?$'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, minLength: 1}
  headers:
    Location:
      schema: {type: string}
    Link:
      description: RFC 8288 pagination links for first, previous, next, and last pages.
      schema: {type: string}
  schemas:
    Repository:
      type: object
      required: [id, name, description, default_branch, version]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        default_branch: {type: string}
        version: {type: integer, minimum: 1}
    RepositoryCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        description: {type: string, maxLength: 255}
        default_branch: {type: string, minLength: 1, maxLength: 160}
    RepositoryPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        description: {type: string, maxLength: 255}
        default_branch: {type: string, minLength: 1, maxLength: 160}
    Reference:
      type: object
      required: [name, algorithm, oid, version]
      properties:
        name: {type: string}
        algorithm: {type: string, enum: [sha1]}
        oid: {type: string, pattern: '^[0-9a-fA-F]{40}$'}
        version: {type: integer, minimum: 1}
    ReferenceCreate:
      type: object
      required: [name, oid]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1}
        algorithm: {type: string, enum: [sha1], default: sha1}
        oid: {type: string, pattern: '^[0-9a-fA-F]{40}$'}
    ReferencePatch:
      type: object
      required: [oid]
      additionalProperties: false
      properties:
        oid: {type: string, pattern: '^[0-9a-fA-F]{40}$'}
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Request conflicts with current state
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionFailed:
      description: If-Match did not match the current version
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionRequired:
      description: If-Match is required
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
